<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcomMart - Cổng truy cập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; }
        .portal-card { max-width: 720px; margin: 0 auto; }
        .brand-title { font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow-sm portal-card">
        <div class="card-body p-4 p-md-5">
            <h3 class="brand-title mb-2">📚 EcomMart</h3>
            <p class="text-muted mb-4">Chọn giao diện theo template mới.</p>

            <div class="row g-3">
                <div class="col-md-6">
                    <div class="border rounded p-3 h-100">
                        <h5>User</h5>
                        <p class="text-muted small">Đăng nhập / đăng ký người dùng</p>
                        <a href="/user/login/" class="btn btn-primary btn-sm">Đăng nhập</a>
                        <a href="/user/register/" class="btn btn-outline-primary btn-sm">Đăng ký</a>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="border rounded p-3 h-100">
                        <h5>Client</h5>
                        <p class="text-muted small">Giao diện mua hàng theo template client</p>
                        <a href="/customer/" class="btn btn-success btn-sm">Vào client</a>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="border rounded p-3 h-100">
                        <h5>Admin</h5>
                        <p class="text-muted small">Giao diện quản trị theo template admin</p>
                        <a href="/admin-panel/" class="btn btn-warning btn-sm">Vào admin</a>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="border rounded p-3 h-100">
                        <h5>Status</h5>
                        <p class="text-muted small">Trang lỗi 403/404/500 theo template status</p>
                        <a href="/status/403/" class="btn btn-outline-secondary btn-sm">403</a>
                        <a href="/status/404/" class="btn btn-outline-secondary btn-sm">404</a>
                        <a href="/status/500/" class="btn btn-outline-secondary btn-sm">500</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
