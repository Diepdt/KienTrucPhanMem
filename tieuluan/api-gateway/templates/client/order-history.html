<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>EcomMart - Lịch sử đơn hàng</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .order-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 1rem;
            transition: box-shadow .15s ease;
        }
        .order-card:hover {
            box-shadow: 0 6px 16px rgba(0,0,0,.06);
        }
        .badge-status {
            font-size: .8rem;
            padding: .4rem .6rem;
        }
        .breadcrumb {
            background-color: transparent;
            padding: 0;
        }
    </style>
</head>
<body>
    {% include 'client/layout/header.html' %}

    <main class="container py-4 py-md-5">
        <nav class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/customer/">Trang chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Lịch sử đơn hàng</li>
            </ol>
        </nav>

        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0"><i class="fa fa-receipt me-2"></i>Lịch sử đơn hàng</h1>
            <a href="/customer/product/" class="btn btn-outline-primary">
                <i class="fa fa-shopping-bag me-2"></i>Mua thêm
            </a>
        </div>

        <div id="order-history-container">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Đang tải lịch sử đơn hàng...</p>
            </div>
        </div>
    </main>

    {% include 'client/layout/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function formatPrice(value) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(Number(value || 0));
        }

        function formatDate(value) {
            if (!value) return 'N/A';
            const date = new Date(value);
            return date.toLocaleString('vi-VN');
        }

        function getStatusClass(status) {
            const map = {
                pending: 'bg-warning text-dark',
                confirmed: 'bg-primary',
                shipping: 'bg-info text-dark',
                delivered: 'bg-success',
                cancelled: 'bg-danger'
            };
            return map[status] || 'bg-secondary';
        }

        function getStatusText(status) {
            const map = {
                pending: 'Chờ xác nhận',
                confirmed: 'Đã xác nhận',
                shipping: 'Đang vận chuyển',
                delivered: 'Đã giao hàng',
                cancelled: 'Đã hủy'
            };
            return map[status] || 'Không xác định';
        }

        function renderOrders(orders) {
            if (!Array.isArray(orders) || orders.length === 0) {
                return `
                    <div class="alert alert-info text-center">
                        <i class="fa fa-inbox fa-2x mb-3 d-block"></i>
                        Bạn chưa có đơn hàng nào.
                    </div>
                `;
            }

            return orders.map(order => {
                const itemCount = Array.isArray(order.items) ? order.items.reduce((sum, item) => sum + Number(item.quantity || 0), 0) : 0;
                return `
                    <div class="order-card mb-3">
                        <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
                            <div>
                                <h5 class="mb-1">Đơn hàng #${order.id}</h5>
                                <div class="text-muted small">${formatDate(order.created_at)}</div>
                            </div>
                            <span class="badge badge-status ${getStatusClass(order.status)}">${getStatusText(order.status)}</span>
                        </div>

                        <hr>

                        <div class="row g-2 small mb-3">
                            <div class="col-md-4"><strong>Thanh toán:</strong> ${order.payment_method_name || 'N/A'}</div>
                            <div class="col-md-4"><strong>Vận chuyển:</strong> ${order.shipping_method_name || 'N/A'}</div>
                            <div class="col-md-4"><strong>Sản phẩm:</strong> ${itemCount}</div>
                            <div class="col-12"><strong>Địa chỉ giao hàng:</strong> ${order.shipping_address || 'N/A'}</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <div class="text-muted small">Tổng thanh toán</div>
                                <div class="fw-bold text-primary fs-5">${formatPrice(order.total_amount)}</div>
                            </div>
                            <a href="/customer/orders/${order.id}/" class="btn btn-outline-primary">
                                <i class="fa fa-eye me-2"></i>Xem chi tiết
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadOrderHistory() {
            const container = document.getElementById('order-history-container');
            const token = localStorage.getItem('customer_token');

            if (!token) {
                container.innerHTML = `
                    <div class="alert alert-warning text-center">
                        <h5>Chưa đăng nhập</h5>
                        <p>Bạn cần đăng nhập để xem lịch sử đơn hàng.</p>
                        <a href="/user/login/" class="btn btn-primary">Đăng nhập ngay</a>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch('/api/orders/history/', {
                    headers: { 'Authorization': `Token ${token}` }
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data?.error || 'Không thể tải lịch sử đơn hàng');
                }

                const orders = Array.isArray(data?.results) ? data.results : (Array.isArray(data) ? data : []);
                container.innerHTML = renderOrders(orders);
            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fa fa-exclamation-circle me-2"></i>
                        Lỗi: ${error.message}
                    </div>
                `;
            }
        }

        window.addEventListener('load', () => {
            if (typeof clientUpdateHeaderState === 'function') {
                clientUpdateHeaderState();
            }
            loadOrderHistory();
        });
    </script>
</body>
</html>
