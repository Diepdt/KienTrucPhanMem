<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>EcomMart - Thanh toán</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }

        .checkout-section {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .checkout-section h4 {
            color: #495057;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e9ecef;
        }

        .shipping-option, .payment-option {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .shipping-option:hover, .payment-option:hover {
            border-color: #0d6efd;
            background-color: #f8f9ff;
        }

        .shipping-option.selected, .payment-option.selected {
            border-color: #0d6efd;
            background-color: #e7f3ff;
        }

        .summary-sidebar {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 1.5rem;
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .book-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f1f1f1;
        }

        .book-item:last-child {
            border-bottom: none;
        }

        .book-thumbnail {
            width: 50px;
            height: 65px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 0.75rem;
        }

        .price-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .total-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #0d6efd;
            border-top: 2px solid #e9ecef;
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .place-order-btn {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 1rem 2rem;
            border-radius: 8px;
            width: 100%;
            margin-top: 1rem;
            transition: transform 0.2s ease;
        }

        .place-order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .security-badges {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .breadcrumb {
            background-color: transparent;
            padding: 0;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }

        .province-select {
            position: relative;
        }

        .coupon-input-group {
            position: relative;
        }

        .payment-extra {
            display: none;
            border: 1px dashed #dbe5f1;
            border-radius: 8px;
            padding: 0.75rem;
            margin-top: 0.75rem;
            background: #f8fbff;
        }

        .payment-extra.show {
            display: block;
        }

        .trust-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            background: #f1f5f9;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    {% include 'client/layout/header.html' %}

    <main class="container py-4 py-md-5">
        <nav class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/customer/">Trang chủ</a></li>
                <li class="breadcrumb-item"><a href="/customer/cart/">Giỏ hàng</a></li>
                <li class="breadcrumb-item active" aria-current="page">Thanh toán</li>
            </ol>
        </nav>

        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0"><i class="fa fa-credit-card me-3"></i>Thanh toán</h1>
            <a href="/customer/cart/" class="btn btn-outline-secondary">
                <i class="fa fa-arrow-left me-2"></i>Quay lại giỏ hàng
            </a>
        </div>

        <div id="checkout-container">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Đang tải thông tin thanh toán...</p>
            </div>
        </div>
    </main>

    {% include 'client/layout/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let cartData = null;
        let customerInfo = null;
        let shippingMethods = [];
        let paymentMethods = [];
        let provinceData = [];
        let districtData = [];
        let discountAmount = 0;

        const checkoutData = {
            shippingMethodId: null,
            paymentMethodId: null,
            paymentType: 'cod',
            couponCode: ''
        };

        const couponRules = {
            BOOK30K: { type: 'fixed', value: 30000 },
            BOOK10: { type: 'percentage', value: 10, max: 50000 },
            WELCOME20K: { type: 'fixed', value: 20000 }
        };

        function formatPrice(value) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(Number(value || 0));
        }

        function getDefaultBookImage() {
            return 'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?q=80&w=900&auto=format&fit=crop';
        }

        function getDefaultClothImage() {
            return 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=900&auto=format&fit=crop';
        }

        function getItemType(item) {
            return (item.product_type || 'book').toLowerCase();
        }

        function getItemTitle(item) {
            return item.product_name || 'Sản phẩm';
        }

        function getItemSubtitle(item) {
            return item.product_subtitle || 'N/A';
        }

        function getItemImage(item) {
            const url = item.product_image_url || '';
            if (url) return url;
            return getItemType(item) === 'cloth' ? getDefaultClothImage() : getDefaultBookImage();
        }

        function escapeHtml(value) {
            return String(value || '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function normalizeText(value) {
            return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function getSelectedShippingMethod() {
            return shippingMethods.find(method => String(method.id) === String(checkoutData.shippingMethodId)) || null;
        }

        function getSelectedPaymentMethod() {
            return paymentMethods.find(method => String(method.id) === String(checkoutData.paymentMethodId)) || null;
        }

        function getShippingFee() {
            return Number(getSelectedShippingMethod()?.cost || 0);
        }

        function getSubtotal() {
            return Number(cartData?.total || 0);
        }

        function getOrderTotal() {
            return Math.max(0, getSubtotal() + getShippingFee() - Number(discountAmount || 0));
        }

        function detectPaymentType(method) {
            const text = normalizeText(`${method?.name || ''} ${method?.description || ''}`);
            if (text.includes('cod') || text.includes('nhan hang')) return 'cod';
            if (text.includes('chuyen khoan') || text.includes('bank') || text.includes('qr')) return 'bank';
            if (text.includes('momo')) return 'momo';
            if (text.includes('vnpay') || text.includes('vnpay')) return 'vnpay';
            if (text.includes('credit') || text.includes('the') || text.includes('visa') || text.includes('master')) return 'credit';
            return 'other';
        }

        function paymentMetaByType(type) {
            const metaMap = {
                cod: {
                    title: 'Thanh toán khi nhận hàng (COD)',
                    desc: 'Bạn thanh toán tiền mặt khi đơn được giao thành công.'
                },
                bank: {
                    title: 'Chuyển khoản ngân hàng (QR)',
                    desc: 'Quét mã QR để chuyển khoản nhanh.'
                },
                momo: {
                    title: 'Ví MoMo',
                    desc: 'Thanh toán qua ví điện tử MoMo.'
                },
                vnpay: {
                    title: 'Ví VNPay',
                    desc: 'Thanh toán qua cổng ví/ATM/QR của VNPay.'
                },
                credit: {
                    title: 'Thẻ tín dụng / ghi nợ',
                    desc: 'Hỗ trợ Visa / Mastercard.'
                },
                other: {
                    title: 'Thanh toán trực tuyến',
                    desc: 'Phương thức thanh toán điện tử.'
                }
            };
            return metaMap[type] || metaMap.other;
        }

        function shippingSortPriority(method) {
            const text = normalizeText(`${method?.name || ''} ${method?.description || ''}`);
            if (text.includes('tiet kiem')) return 1;
            if (text.includes('hoa toc') || text.includes('express')) return 2;
            return 3;
        }

        function paymentSortPriority(method) {
            const type = detectPaymentType(method);
            const order = { cod: 1, bank: 2, momo: 3, vnpay: 4, credit: 5, other: 6 };
            return order[type] || 99;
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, options);
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                const message = data?.error || data?.detail || `HTTP ${response.status}`;
                throw new Error(message);
            }
            return data;
        }

        async function ensureShippingMethods() {
            const current = await fetchJson('/api/shipping/methods/');
            const list = Array.isArray(current) ? current : [];

            const hasEconomy = list.some(item => normalizeText(item.name).includes('tiet kiem'));
            const hasExpress = list.some(item => normalizeText(item.name).includes('hoa toc') || normalizeText(item.name).includes('express'));

            if (!hasEconomy) {
                await fetchJson('/api/shipping/methods/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'BookShip - Tiết kiệm',
                        description: 'Đơn vị: BookShip | 3-5 ngày làm việc',
                        cost: '20000.00',
                        delivery_days: 4,
                        is_active: true
                    })
                });
            }

            if (!hasExpress) {
                await fetchJson('/api/shipping/methods/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'BookShip - Hỏa tốc',
                        description: 'Đơn vị: BookShip Express | 1 ngày làm việc',
                        cost: '50000.00',
                        delivery_days: 1,
                        is_active: true
                    })
                });
            }

            shippingMethods = await fetchJson('/api/shipping/methods/');
            shippingMethods = (Array.isArray(shippingMethods) ? shippingMethods : [])
                .sort((a, b) => shippingSortPriority(a) - shippingSortPriority(b));

            if (!checkoutData.shippingMethodId && shippingMethods.length > 0) {
                checkoutData.shippingMethodId = shippingMethods[0].id;
            }
        }

        async function ensurePaymentMethods() {
            const current = await fetchJson('/api/payment/methods/');
            const list = Array.isArray(current) ? current : [];

            const required = [
                { key: 'cod', name: 'COD', description: 'Thanh toán khi nhận hàng' },
                { key: 'bank', name: 'Chuyển khoản QR', description: 'Chuyển khoản ngân hàng qua mã QR' },
                { key: 'momo', name: 'Ví MoMo', description: 'Thanh toán qua ví điện tử MoMo' },
                { key: 'vnpay', name: 'Ví VNPay', description: 'Thanh toán qua ví/cổng VNPay' },
                { key: 'credit', name: 'Thẻ tín dụng', description: 'Visa / Mastercard' }
            ];

            for (const item of required) {
                const found = list.some(method => detectPaymentType(method) === item.key);
                if (!found) {
                    await fetchJson('/api/payment/methods/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: item.name,
                            description: item.description,
                            is_active: true
                        })
                    });
                }
            }

            paymentMethods = await fetchJson('/api/payment/methods/');
            paymentMethods = (Array.isArray(paymentMethods) ? paymentMethods : [])
                .sort((a, b) => paymentSortPriority(a) - paymentSortPriority(b));

            if (!checkoutData.paymentMethodId && paymentMethods.length > 0) {
                checkoutData.paymentMethodId = paymentMethods[0].id;
                checkoutData.paymentType = detectPaymentType(paymentMethods[0]);
            }
        }

        async function loadProvinces() {
            try {
                const data = await fetchJson('https://provinces.open-api.vn/api/p/');
                provinceData = Array.isArray(data) ? data : [];
            } catch (error) {
                provinceData = [];
                showNotification('Không tải được dữ liệu Tỉnh/Thành từ API địa chỉ.', 'error');
            }
        }

        async function loadDistrictsByProvinceCode(provinceCode) {
            districtData = [];
            if (!provinceCode) return;

            try {
                const detail = await fetchJson(`https://provinces.open-api.vn/api/p/${provinceCode}?depth=2`);
                districtData = Array.isArray(detail?.districts) ? detail.districts : [];
            } catch (error) {
                districtData = [];
                showNotification('Không tải được Quận/Huyện từ API địa chỉ.', 'error');
            }
        }

        function renderShippingMethodOptions() {
            if (!shippingMethods.length) {
                return `
                    <div class="alert alert-warning mb-0">Chưa có phương thức vận chuyển khả dụng.</div>
                `;
            }

            return shippingMethods.map(method => {
                const isSelected = String(method.id) === String(checkoutData.shippingMethodId);
                const selectedClass = isSelected ? 'selected' : '';
                const providerText = method.description || 'Đơn vị vận chuyển uy tín';
                const eta = Number(method.delivery_days || 0);
                return `
                    <div class="shipping-option ${selectedClass}" data-method-id="${method.id}">
                        <div class="d-flex justify-content-between align-items-center gap-3">
                            <div>
                                <div class="d-flex align-items-center">
                                    <input type="radio" name="shipping" value="${method.id}" class="form-check-input me-2" ${isSelected ? 'checked' : ''}>
                                    <strong>${escapeHtml(method.name)}</strong>
                                </div>
                                <small class="text-muted d-block">${escapeHtml(providerText)}</small>
                                <small class="text-muted">Dự kiến: ${eta > 0 ? `${eta} ngày làm việc` : 'Liên hệ để biết thêm'}</small>
                            </div>
                            <span class="text-primary fw-bold">${formatPrice(method.cost)}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPaymentMethodOptions() {
            if (!paymentMethods.length) {
                return `
                    <div class="alert alert-warning mb-0">Chưa có phương thức thanh toán khả dụng.</div>
                `;
            }

            return paymentMethods.map(method => {
                const type = detectPaymentType(method);
                const meta = paymentMetaByType(type);
                const isSelected = String(method.id) === String(checkoutData.paymentMethodId);
                const selectedClass = isSelected ? 'selected' : '';
                return `
                    <div class="payment-option ${selectedClass}" data-method-id="${method.id}" data-payment-type="${type}">
                        <div class="d-flex align-items-center">
                            <input type="radio" name="payment" value="${method.id}" class="form-check-input me-2" ${isSelected ? 'checked' : ''}>
                            <div>
                                <strong>${escapeHtml(meta.title)}</strong>
                                <small class="text-muted d-block">${escapeHtml(meta.desc)}</small>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderProvinceOptions() {
            const options = provinceData.map(province => (
                `<option value="${province.code}">${escapeHtml(province.name)}</option>`
            )).join('');
            return `<option value="">Chọn Tỉnh/Thành</option>${options}`;
        }

        function renderDistrictOptions() {
            const options = districtData.map(district => (
                `<option value="${district.code}">${escapeHtml(district.name)}</option>`
            )).join('');
            return `<option value="">Chọn Quận/Huyện</option>${options}`;
        }

        function renderCheckoutForm(cart) {
            const container = document.getElementById('checkout-container');

            container.innerHTML = `
                <div class="row">
                    <div class="col-lg-8">
                        <div class="checkout-section">
                            <h4><i class="fa fa-truck me-2"></i>Thông tin giao hàng</h4>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="shipping-name" value="${escapeHtml(customerInfo?.name || customerInfo?.full_name || '')}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" id="shipping-phone" value="${escapeHtml(customerInfo?.phone || '')}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Tỉnh/Thành phố <span class="text-danger">*</span></label>
                                    <select class="form-select" id="shipping-province" required>
                                        ${renderProvinceOptions()}
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Quận/Huyện <span class="text-danger">*</span></label>
                                    <select class="form-select" id="shipping-district" required>
                                        ${renderDistrictOptions()}
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Địa chỉ <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="shipping-address" placeholder="Số nhà, tên đường..." required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Ghi chú</label>
                                    <textarea class="form-control" id="shipping-note" rows="2" placeholder="VD: Gói quà giúp mình / Gửi sách giờ hành chính"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="checkout-section">
                            <h4><i class="fa fa-shipping-fast me-2"></i>Phương thức vận chuyển</h4>
                            ${renderShippingMethodOptions()}
                        </div>

                        <div class="checkout-section">
                            <h4><i class="fa fa-credit-card me-2"></i>Phương thức thanh toán</h4>
                            ${renderPaymentMethodOptions()}

                            <div id="bank-qr-box" class="payment-extra">
                                <div class="fw-semibold mb-2">Quét mã QR để thanh toán chuyển khoản</div>
                                <div class="d-flex align-items-center gap-3 flex-wrap">
                                    <img id="bank-qr-image" src="" alt="QR chuyển khoản" width="160" height="160" class="border rounded p-1 bg-white">
                                    <div class="small text-muted">
                                        Ngân hàng: Vietcombank<br>
                                        STK: 0123456789<br>
                                        Nội dung: THANHTOAN EcomMart
                                    </div>
                                </div>
                            </div>

                            <div class="security-badges flex-wrap mt-3">
                                <span class="trust-chip"><i class="fa fa-shield-alt text-success"></i> SSL 256-bit</span>
                                <span class="trust-chip"><i class="fab fa-cc-visa text-primary"></i> Visa</span>
                                <span class="trust-chip"><i class="fab fa-cc-mastercard text-warning"></i> Mastercard</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="summary-sidebar">
                            <h5><i class="fa fa-list-alt me-2"></i>Tóm tắt đơn hàng</h5>
                            <hr>

                            <div class="books-list">
                                ${cart.items.map(item => `
                                    <div class="book-item">
                                        <img src="${escapeHtml(getItemImage(item))}" class="book-thumbnail" alt="${escapeHtml(getItemTitle(item))}">
                                        <div class="flex-grow-1">
                                            <div class="fw-semibold">${escapeHtml(getItemTitle(item))}</div>
                                            <small class="text-muted">${escapeHtml(getItemType(item).toUpperCase())} | ${escapeHtml(getItemSubtitle(item))}</small>
                                            <div class="d-flex justify-content-between mt-1">
                                                <span>SL: ${item.quantity}</span>
                                                <span class="text-primary">${formatPrice(item.item_total)}</span>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <hr>

                            <div class="coupon-section mb-3">
                                <label class="form-label">Mã giảm giá</label>
                                <div class="coupon-input-group">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="coupon-code" placeholder="Nhập mã giảm giá">
                                        <button class="btn btn-outline-primary" type="button" onclick="applyCoupon()">
                                            <i class="fa fa-check"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="price-breakdown">
                                <div class="price-line">
                                    <span>Tạm tính:</span>
                                    <span id="subtotal-amount">${formatPrice(getSubtotal())}</span>
                                </div>
                                <div class="price-line">
                                    <span>Phí vận chuyển:</span>
                                    <span id="shipping-fee">${formatPrice(getShippingFee())}</span>
                                </div>
                                <div class="price-line text-success" id="discount-line" style="display: none;">
                                    <span>Giảm giá:</span>
                                    <span id="discount-amount">-${formatPrice(0)}</span>
                                </div>
                                <div class="price-line total-price">
                                    <span>Tổng cộng:</span>
                                    <span id="total-amount">${formatPrice(getOrderTotal())}</span>
                                </div>
                            </div>

                            <button class="place-order-btn" onclick="placeOrder()">
                                <i class="fa fa-check-circle me-2"></i>Đặt hàng ngay
                            </button>

                            <small class="text-muted d-block text-center mt-2">
                                Bằng cách nhấn Đặt hàng, bạn đồng ý với
                                <a href="#" class="text-decoration-none">Điều khoản dịch vụ</a> của chúng tôi.
                            </small>
                        </div>
                    </div>
                </div>
            `;

            initializeFormInteractions();
            updatePricingUI();
            updatePaymentExtraUI();
        }

        function initializeFormInteractions() {
            document.querySelectorAll('.shipping-option').forEach(option => {
                option.addEventListener('click', function () {
                    document.querySelectorAll('.shipping-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    const radio = this.querySelector('input[type="radio"]');
                    radio.checked = true;
                    checkoutData.shippingMethodId = radio.value;
                    updatePricingUI();
                });
            });

            document.querySelectorAll('.payment-option').forEach(option => {
                option.addEventListener('click', function () {
                    document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    const radio = this.querySelector('input[type="radio"]');
                    radio.checked = true;
                    checkoutData.paymentMethodId = radio.value;
                    checkoutData.paymentType = this.dataset.paymentType || 'other';
                    updatePaymentExtraUI();
                });
            });

            const provinceSelect = document.getElementById('shipping-province');
            const districtSelect = document.getElementById('shipping-district');

            provinceSelect.addEventListener('change', async function () {
                districtSelect.disabled = true;
                districtSelect.innerHTML = '<option value="">Đang tải quận/huyện...</option>';
                await loadDistrictsByProvinceCode(this.value);
                districtSelect.innerHTML = renderDistrictOptions();
                districtSelect.disabled = false;
            });
        }

        function updatePricingUI() {
            const shippingFeeEl = document.getElementById('shipping-fee');
            const discountLineEl = document.getElementById('discount-line');
            const discountAmountEl = document.getElementById('discount-amount');
            const totalAmountEl = document.getElementById('total-amount');

            if (shippingFeeEl) shippingFeeEl.textContent = formatPrice(getShippingFee());

            if (Number(discountAmount) > 0) {
                discountLineEl.style.display = 'flex';
                discountAmountEl.textContent = `-${formatPrice(discountAmount)}`;
            } else {
                discountLineEl.style.display = 'none';
                discountAmountEl.textContent = `-${formatPrice(0)}`;
            }

            if (totalAmountEl) totalAmountEl.textContent = formatPrice(getOrderTotal());
            updateBankQrImage();
        }

        function updateBankQrImage() {
            const qrImg = document.getElementById('bank-qr-image');
            if (!qrImg) return;
            const amount = Math.round(getOrderTotal());
            const qrUrl = `https://img.vietqr.io/image/VCB-0123456789-compact2.png?amount=${amount}&addInfo=THANHTOAN_EcomMart`;
            qrImg.src = qrUrl;
        }

        function updatePaymentExtraUI() {
            const bankBox = document.getElementById('bank-qr-box');
            if (!bankBox) return;

            if (checkoutData.paymentType === 'bank') {
                bankBox.classList.add('show');
            } else {
                bankBox.classList.remove('show');
            }
        }

        function computeCouponDiscount(subtotal, couponCode) {
            const rule = couponRules[couponCode.toUpperCase()];
            if (!rule) return 0;

            if (rule.type === 'fixed') {
                return Math.min(subtotal, Number(rule.value));
            }

            if (rule.type === 'percentage') {
                const raw = subtotal * (Number(rule.value) / 100);
                return Math.min(subtotal, rule.max ? Math.min(raw, Number(rule.max)) : raw);
            }

            return 0;
        }

        async function applyCoupon() {
            const input = document.getElementById('coupon-code');
            const couponCode = (input?.value || '').trim().toUpperCase();

            if (!couponCode) {
                discountAmount = 0;
                checkoutData.couponCode = '';
                updatePricingUI();
                return;
            }

            const discount = Math.round(computeCouponDiscount(getSubtotal(), couponCode));

            if (discount <= 0) {
                showNotification('Mã giảm giá không hợp lệ!', 'error');
                return;
            }

            checkoutData.couponCode = couponCode;
            discountAmount = discount;
            updatePricingUI();
            showNotification('Áp dụng mã giảm giá thành công!', 'success');
        }

        function collectShippingFormData() {
            const name = (document.getElementById('shipping-name')?.value || '').trim();
            const phone = (document.getElementById('shipping-phone')?.value || '').trim();
            const provinceCode = document.getElementById('shipping-province')?.value || '';
            const districtCode = document.getElementById('shipping-district')?.value || '';
            const address = (document.getElementById('shipping-address')?.value || '').trim();
            const note = (document.getElementById('shipping-note')?.value || '').trim();

            const province = provinceData.find(item => String(item.code) === String(provinceCode));
            const district = districtData.find(item => String(item.code) === String(districtCode));

            return {
                name,
                phone,
                address,
                note,
                provinceCode,
                districtCode,
                provinceName: province?.name || '',
                districtName: district?.name || ''
            };
        }

        function saveOrderSnapshotToLocalHistory(orderPayload) {
            try {
                const customerId = customerInfo?.id;
                if (!customerId || !orderPayload) return;

                const storageKey = `customer_order_history_${customerId}`;
                const existing = JSON.parse(localStorage.getItem(storageKey) || '[]');
                const next = Array.isArray(existing) ? existing : [];

                next.unshift({
                    id: orderPayload?.order?.id,
                    status: orderPayload?.order?.status,
                    total_amount: orderPayload?.order?.total_amount,
                    shipping_address: orderPayload?.order?.shipping_address,
                    created_at: orderPayload?.order?.created_at,
                    payment_method_name: orderPayload?.order?.payment_method_name,
                    shipping_method_name: orderPayload?.order?.shipping_method_name,
                    items: Array.isArray(orderPayload?.order?.items) ? orderPayload.order.items : []
                });

                localStorage.setItem(storageKey, JSON.stringify(next.slice(0, 30)));
            } catch (error) {
                console.warn('Cannot save order snapshot to local history:', error);
            }
        }

        function validateCheckoutData() {
            const shipping = collectShippingFormData();

            if (!shipping.name || !shipping.phone || !shipping.address || !shipping.provinceCode || !shipping.districtCode) {
                throw new Error('Vui lòng nhập đủ Họ tên, SĐT, Địa chỉ và chọn Tỉnh/Quận.');
            }

            if (!/^0\d{9,10}$/.test(shipping.phone)) {
                throw new Error('Số điện thoại không hợp lệ.');
            }

            if (!checkoutData.shippingMethodId) {
                throw new Error('Vui lòng chọn phương thức vận chuyển.');
            }

            if (!checkoutData.paymentMethodId) {
                throw new Error('Vui lòng chọn phương thức thanh toán.');
            }

            return shipping;
        }

        async function placeOrder() {
            const token = localStorage.getItem('customer_token');
            if (!token) {
                showNotification('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.', 'error');
                return;
            }

            let shipping;
            try {
                shipping = validateCheckoutData();
            } catch (error) {
                showNotification(error.message, 'error');
                return;
            }

            const selectedShipping = getSelectedShippingMethod();
            const selectedPayment = getSelectedPaymentMethod();

            const fullAddress = `${shipping.address}, ${shipping.districtName}, ${shipping.provinceName}`;
            const notes = [
                `Người nhận: ${shipping.name}`,
                `SĐT: ${shipping.phone}`,
                shipping.note ? `Ghi chú: ${shipping.note}` : '',
                checkoutData.couponCode ? `Coupon: ${checkoutData.couponCode}` : ''
            ].filter(Boolean).join(' | ');

            const payload = {
                shipping_method_id: Number(selectedShipping?.id),
                payment_method_id: Number(selectedPayment?.id),
                shipping_address: fullAddress,
                notes,
                item_ids: cartData.items.map(item => item.id)
            };

            const button = document.querySelector('.place-order-btn');
            const originalBtnHtml = button.innerHTML;

            try {
                button.disabled = true;
                button.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i>Đang xử lý...';

                const orderResult = await fetchJson('/api/orders/create/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                saveOrderSnapshotToLocalHistory(orderResult);

                const orderId = orderResult?.order?.id;
                const purchaseItems = Array.isArray(cartData?.items) ? cartData.items : [];
                purchaseItems.forEach((item) => {
                    postAIEvent('purchase', Number(item.product_id), {
                        order_id: orderId || null,
                        quantity: Number(item.quantity || 1),
                    });
                });

                showNotification(`Đặt hàng thành công${orderId ? ` #${orderId}` : ''}!`, 'success');

                setTimeout(() => {
                    window.location.href = '/customer/';
                }, 1800);
            } catch (error) {
                showNotification(`Có lỗi khi đặt hàng: ${error.message}`, 'error');
                button.disabled = false;
                button.innerHTML = originalBtnHtml;
            }
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `alert alert-${type === 'success' ? 'success' : 'danger'} alert-dismissible fade show position-fixed`;
            notification.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 320px;';
            notification.innerHTML = `
                <i class="fa fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(notification);

            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 4000);
        }

        function getCustomerIdForAI() {
            try {
                const info = JSON.parse(localStorage.getItem('customer_info') || '{}');
                const id = Number(info.id || 0);
                if (Number.isFinite(id) && id > 0) return id;
            } catch {}
            return 0;
        }

        async function postAIEvent(eventType, productId = null, payloadExtra = {}) {
            const customerId = getCustomerIdForAI();
            if (!customerId) return;
            try {
                await fetch('/api/events/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_id: customerId,
                        event_type: eventType,
                        service_type: 'gateway-checkout',
                        product_id: productId,
                        query_text: '',
                        payload: {
                            page: 'checkout',
                            ...payloadExtra,
                        },
                    }),
                });
            } catch {}
        }

        async function loadCheckout() {
            const container = document.getElementById('checkout-container');
            const token = localStorage.getItem('customer_token');

            if (!token) {
                container.innerHTML = `
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <div class="alert alert-warning text-center">
                                <i class="fa fa-exclamation-triangle fa-2x mb-3"></i>
                                <h5>Chưa đăng nhập</h5>
                                <p>Bạn cần đăng nhập để thanh toán.</p>
                                <a href="/user/login/" class="btn btn-primary">Đăng nhập ngay</a>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            try {
                customerInfo = JSON.parse(localStorage.getItem('customer_info') || '{}');
                if (!customerInfo.id) {
                    throw new Error('Thông tin khách hàng không hợp lệ.');
                }

                const [cart, _shipping, _payment, _province] = await Promise.all([
                    fetchJson(`/api/carts/${customerInfo.id}/`, {
                        headers: { 'Authorization': `Token ${token}` }
                    }),
                    ensureShippingMethods(),
                    ensurePaymentMethods(),
                    loadProvinces()
                ]);

                // Filter cart items if specific items selected from cart page
                const urlParams = new URLSearchParams(window.location.search);
                const selectedItemsParam = urlParams.get('items');
                if (selectedItemsParam) {
                    const selectedIds = new Set(selectedItemsParam.split(',').map(id => parseInt(id)));
                    cart.items = cart.items.filter(item => selectedIds.has(item.id));
                    cart.total = cart.items.reduce((sum, item) => sum + parseFloat(item.item_total || 0), 0);
                }

                cartData = cart;
                if (!Array.isArray(cartData.items) || cartData.items.length === 0) {
                    container.innerHTML = `
                        <div class="row justify-content-center">
                            <div class="col-md-6">
                                <div class="alert alert-warning text-center">
                                    <i class="fa fa-shopping-cart fa-2x mb-3"></i>
                                    <h5>Giỏ hàng trống</h5>
                                    <p>Vui lòng thêm sản phẩm vào giỏ trước khi thanh toán.</p>
                                    <a href="/customer/product/" class="btn btn-primary">Mua sắm ngay</a>
                                </div>
                            </div>
                        </div>
                    `;
                    return;
                }

                renderCheckoutForm(cartData);
            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fa fa-exclamation-circle me-2"></i>
                        Lỗi: ${escapeHtml(error.message || 'Không thể tải trang thanh toán')}
                        <div class="mt-2">
                            <button class="btn btn-outline-danger btn-sm" onclick="loadCheckout()">Thử lại</button>
                        </div>
                    </div>
                `;
            }
        }

        window.addEventListener('load', () => {
            if (typeof clientUpdateHeaderState === 'function') {
                clientUpdateHeaderState();
            }
            loadCheckout();
        });
    </script>
</body>
