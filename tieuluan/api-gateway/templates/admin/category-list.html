<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Manage Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin@7.0.7/dist/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
    {% include 'admin/layout/header.html' %}
    <div id="layoutSidenav">
        {% include 'admin/layout/sidenav.html' %}
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage Categories</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin-panel/">Dashboard</a></li>
                        <li class="breadcrumb-item active">Categories</li>
                    </ol>

                    <div class="row g-4">
                        <div class="col-lg-5">
                            <div class="card">
                                <div class="card-header fw-semibold">Create category</div>
                                <div class="card-body">
                                    <form onsubmit="event.preventDefault(); createCategory();">
                                        <div class="mb-3">
                                            <label class="form-label">Product Type</label>
                                            <select id="c-product-type" class="form-select" onchange="loadCategories();" required>
                                                <option value="">-- Select Product Type --</option>
                                                <option value="book">Book</option>
                                                <option value="cloth">Cloth</option>
                                                <option value="laptop">Laptop</option>
                                                <option value="mobile">Mobile</option>
                                                <option value="tablet">Tablet</option>
                                                <option value="smartwatch">Smartwatch</option>
                                                <option value="headphone">Headphone</option>
                                                <option value="camera">Camera</option>
                                                <option value="keyboard">Keyboard</option>
                                                <option value="mouse">Mouse</option>
                                                <option value="monitor">Monitor</option>
                                                <option value="speaker">Speaker</option>
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Name</label>
                                            <input id="c-name" type="text" class="form-control" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Description</label>
                                            <textarea id="c-description" class="form-control" rows="3"></textarea>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Parent Category (optional)</label>
                                            <select id="c-parent" class="form-select">
                                                <option value="">No parent</option>
                                            </select>
                                        </div>
                                        <div id="category-form-error" class="alert alert-danger d-none py-2 small"></div>
                                        <div class="d-flex gap-2">
                                            <button id="category-submit-btn" type="submit" class="btn btn-warning">Create</button>
                                            <button id="category-cancel-btn" type="button" class="btn btn-secondary d-none" onclick="cancelCategoryEdit()">Cancel</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-7">
                            <div class="card">
                                <div class="card-header fw-semibold">Category list</div>
                                <div class="card-body p-0">
                                    <table class="table table-hover table-striped mb-0">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Name</th>
                                                <th>Description</th>
                                                <th>Parent</th>
                                                <th>Action</th>
                                            </tr>
                                        </thead>
                                        <tbody id="admin-category-list-body">
                                            <tr><td colspan="5" class="text-center">Vui lòng chọn Product Type bên trái</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            {% include 'admin/layout/footer.html' %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let flatCategories = [];
        let editingCategoryId = null;
        let currentProductType = 'book'; // Default product type

        function showCategoryError(message) {
            const el = document.getElementById('category-form-error');
            el.textContent = message;
            el.classList.remove('d-none');
        }

        function clearCategoryError() {
            const el = document.getElementById('category-form-error');
            el.textContent = '';
            el.classList.add('d-none');
        }

        function flattenCategories(categories, parentName = '') {
            const result = [];
            for (const category of categories || []) {
                result.push({
                    id: category.id,
                    name: category.name,
                    description: category.description || '',
                    product_type: category.product_type || '',
                    parentId: category.parent || null,
                    parentName
                });

                const children = Array.isArray(category.subcategories) ? category.subcategories : [];
                if (children.length) {
                    result.push(...flattenCategories(children, category.name));
                }
            }
            return result;
        }

        function renderCategoryRows() {
            const body = document.getElementById('admin-category-list-body');
            if (!flatCategories.length) {
                body.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Chưa có category</td></tr>';
                return;
            }

            body.innerHTML = flatCategories.map((item) => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.name}</td>
                    <td>${item.description || ''}</td>
                    <td>${item.parentName || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="startCategoryEdit(${item.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteCategory(${item.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderParentOptions() {
            const select = document.getElementById('c-parent');
            const options = flatCategories
                .filter((item) => !editingCategoryId || item.id !== editingCategoryId)
                .map((item) => `<option value="${item.id}">${item.name}</option>`)
                .join('');
            select.innerHTML = `<option value="">No parent</option>${options}`;
        }

        function startCategoryEdit(id) {
            const target = flatCategories.find((item) => item.id === id);
            if (!target) return;

            editingCategoryId = id;
            document.getElementById('c-name').value = target.name || '';
            document.getElementById('c-description').value = target.description || '';
            document.getElementById('c-product-type').value = target.product_type || currentProductType;
            renderParentOptions();
            document.getElementById('c-parent').value = target.parentId ? String(target.parentId) : '';

            document.getElementById('category-submit-btn').textContent = 'Update';
            document.getElementById('category-cancel-btn').classList.remove('d-none');
            clearCategoryError();
        }

        function cancelCategoryEdit() {
            editingCategoryId = null;
            document.getElementById('c-name').value = '';
            document.getElementById('c-description').value = '';
            document.getElementById('c-parent').value = '';

            document.getElementById('category-submit-btn').textContent = 'Create';
            document.getElementById('category-cancel-btn').classList.add('d-none');
            renderParentOptions();
            clearCategoryError();
        }

        async function loadCategories() {
            const body = document.getElementById('admin-category-list-body');
            const productType = document.getElementById('c-product-type').value;
            
            if (!productType) {
                body.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Vui lòng chọn Product Type</td></tr>';
                return;
            }
            
            currentProductType = productType;
            body.innerHTML = '<tr><td colspan="4" class="text-center">Đang tải...</td></tr>';

            try {
                const res = await fetch(`/api/categories/?product_type=${productType}`);
                const data = await res.json();
                if (!res.ok || !Array.isArray(data)) throw new Error('Không thể tải danh mục');

                flatCategories = flattenCategories(data);
                renderCategoryRows();
                renderParentOptions();
            } catch (error) {
                body.innerHTML = `<tr><td colspan="5" class="text-center text-danger">${error.message}</td></tr>`;
            }
        }

        async function createCategory() {
            clearCategoryError();

            const token = localStorage.getItem('admin_token');
            if (!token) {
                showCategoryError('Bạn cần đăng nhập admin trước khi tạo category.');
                return;
            }

            const payload = {
                name: document.getElementById('c-name').value.trim(),
                description: document.getElementById('c-description').value.trim(),
                product_type: document.getElementById('c-product-type').value,
                parent: document.getElementById('c-parent').value ? Number(document.getElementById('c-parent').value) : null,
            };

            if (!payload.name) {
                showCategoryError('Tên category không được để trống.');
                return;
            }

            if (!payload.product_type) {
                showCategoryError('Vui lòng chọn Product Type.');
                return;
            }

            const endpoint = editingCategoryId ? `/api/categories/${editingCategoryId}/` : '/api/categories/';
            const method = editingCategoryId ? 'PUT' : 'POST';

            const res = await fetch(endpoint, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Token ${token}`,
                },
                body: JSON.stringify(payload),
            });

            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const message = data.error || Object.values(data || {}).flat().join(' | ') || `${editingCategoryId ? 'Cập nhật' : 'Tạo'} category thất bại`;
                showCategoryError(message);
                return;
            }

            cancelCategoryEdit();
            await loadCategories();
        }

        async function deleteCategory(id) {
            if (!confirm(`Xóa category #${id}?`)) return;

            const token = localStorage.getItem('admin_token');
            if (!token) {
                showCategoryError('Bạn cần đăng nhập admin trước khi xóa category.');
                return;
            }

            const res = await fetch(`/api/categories/${id}/`, {
                method: 'DELETE',
                headers: { 'Authorization': `Token ${token}` },
            });

            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                const message = data.error || Object.values(data || {}).flat().join(' | ') || 'Xóa category thất bại';
                showCategoryError(message);
                return;
            }

            if (editingCategoryId === id) {
                cancelCategoryEdit();
            }

            await loadCategories();
        }

        // Initialize page: set default product_type and load categories
        window.addEventListener('DOMContentLoaded', function() {
            const productTypeSelect = document.getElementById('c-product-type');
            if (productTypeSelect) {
                productTypeSelect.value = currentProductType;
                loadCategories();
            }
        });
    </script>
</body>
</html>
