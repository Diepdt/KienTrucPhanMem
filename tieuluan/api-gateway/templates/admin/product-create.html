<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Create Product</title>
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin@7.0.7/dist/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
    {% include 'admin/layout/header.html' %}
    <div id="layoutSidenav">
        {% include 'admin/layout/sidenav.html' %}
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage Products</h1>
                    <ol class="breadcrumb mb-4"><li class="breadcrumb-item"><a href="/admin-panel/">Dashboard</a></li><li class="breadcrumb-item"><a href="/admin-panel/products/">Products</a></li><li class="breadcrumb-item active">Create product</li></ol>
                    <div class="row col-6 mx-auto">
                        <form onsubmit="event.preventDefault();createProduct();">
                            <div class="mb-3">
                                <label class="form-label">Product Type:</label>
                                <select id="p-type" class="form-select" onchange="toggleProductTypeFields()">
                                    <option value="book">Book</option>
                                    <option value="cloth">Cloth</option>
                                    <option value="laptop">Laptop</option>
                                    <option value="mobile">Mobile</option>
                                    <option value="tablet">Tablet</option>
                                    <option value="smartwatch">Smartwatch</option>
                                    <option value="headphone">Headphone</option>
                                    <option value="camera">Camera</option>
                                    <option value="keyboard">Keyboard</option>
                                    <option value="mouse">Mouse</option>
                                    <option value="monitor">Monitor</option>
                                    <option value="speaker">Speaker</option>
                                </select>
                            </div>

                            <!-- GENERIC Fields for non-legacy product types -->
                            <div id="generic-fields" class="row d-none">
                                <div class="mb-3 col-6"><label class="form-label">Name:</label><input id="g-name" type="text" class="form-control" data-required="true"></div>
                                <div class="mb-3 col-6"><label class="form-label">Brand/Info:</label><input id="g-brand" type="text" class="form-control"></div>
                            </div>

                            <!-- BOOK Fields -->
                            <div id="book-fields">
                                <div class="row"><div class="mb-3 col-6"><label class="form-label">Title:</label><input id="b-title" type="text" class="form-control" data-required="true"></div><div class="mb-3 col-6"><label class="form-label">Author:</label><input id="b-author" type="text" class="form-control" data-required="true"></div></div>
                            </div>

                            <!-- CLOTH Fields -->
                            <div id="cloth-fields" class="row d-none">
                                <div class="mb-3 col-6"><label class="form-label">Name:</label><input id="c-name" type="text" class="form-control" data-required="true"></div>
                                <div class="mb-3 col-6"><label class="form-label">Brand:</label><input id="c-brand" type="text" class="form-control"></div>
                                <div class="mb-3 col-6"><label class="form-label">Size:</label><input id="c-size" type="text" class="form-control"></div>
                                <div class="mb-3 col-6"><label class="form-label">Color:</label><input id="c-color" type="text" class="form-control"></div>
                                <div class="mb-3 col-6"><label class="form-label">Material:</label><input id="c-material" type="text" class="form-control"></div>
                            </div>

                            <!-- LAPTOP Fields -->
                            <div id="laptop-fields" class="row d-none">
                                <div class="mb-3 col-6"><label class="form-label">Name:</label><input id="l-name" type="text" class="form-control" data-required="true"></div>
                                <div class="mb-3 col-6"><label class="form-label">Brand:</label><input id="l-brand" type="text" class="form-control"></div>
                                <div class="mb-3 col-6"><label class="form-label">Model:</label><input id="l-model" type="text" class="form-control"></div>
                                <div class="mb-3 col-6"><label class="form-label">Processor:</label><input id="l-processor" type="text" class="form-control"></div>
                                <div class="mb-3 col-6"><label class="form-label">RAM:</label><input id="l-ram" type="text" class="form-control" placeholder="e.g., 16GB DDR4"></div>
                                <div class="mb-3 col-6"><label class="form-label">Storage:</label><input id="l-storage" type="text" class="form-control" placeholder="e.g., 512GB SSD"></div>
                                <div class="mb-3 col-6"><label class="form-label">Display Size:</label><input id="l-display-size" type="text" class="form-control" placeholder="e.g., 15.6 inches"></div>
                                <div class="mb-3 col-6"><label class="form-label">Display Type:</label><input id="l-display-type" type="text" class="form-control" placeholder="e.g., IPS"></div>
                                <div class="mb-3 col-6"><label class="form-label">Graphics:</label><input id="l-graphics" type="text" class="form-control" placeholder="e.g., NVIDIA RTX 4050"></div>
                                <div class="mb-3 col-6"><label class="form-label">Battery:</label><input id="l-battery" type="text" class="form-control"></div>
                                <div class="mb-3 col-6"><label class="form-label">Weight:</label><input id="l-weight" type="text" class="form-control" placeholder="e.g., 1.8kg"></div>
                                <div class="mb-3 col-6"><label class="form-label">Color:</label><input id="l-color" type="text" class="form-control"></div>
                            </div>

                            <!-- MOBILE Fields -->
                            <div id="mobile-fields" class="row d-none">
                                <div class="mb-3 col-6"><label class="form-label">Name:</label><input id="m-name" type="text" class="form-control" data-required="true"></div>
                                <div class="mb-3 col-6"><label class="form-label">Brand:</label><input id="m-brand" type="text" class="form-control"></div>
                                <div class="mb-3 col-6"><label class="form-label">Model:</label><input id="m-model" type="text" class="form-control"></div>
                                <div class="mb-3 col-6"><label class="form-label">OS:</label><input id="m-os" type="text" class="form-control" placeholder="e.g., iOS, Android"></div>
                                <div class="mb-3 col-6"><label class="form-label">Processor:</label><input id="m-processor" type="text" class="form-control"></div>
                                <div class="mb-3 col-6"><label class="form-label">RAM:</label><input id="m-ram" type="text" class="form-control" placeholder="e.g., 12GB"></div>
                                <div class="mb-3 col-6"><label class="form-label">Storage:</label><input id="m-storage" type="text" class="form-control" placeholder="e.g., 256GB"></div>
                                <div class="mb-3 col-6"><label class="form-label">Display Size:</label><input id="m-display-size" type="text" class="form-control" placeholder="e.g., 6.7 inches"></div>
                                <div class="mb-3 col-6"><label class="form-label">Display Type:</label><input id="m-display-type" type="text" class="form-control" placeholder="e.g., AMOLED"></div>
                                <div class="mb-3 col-6"><label class="form-label">Camera:</label><input id="m-camera" type="text" class="form-control" placeholder="e.g., 108MP"></div>
                                <div class="mb-3 col-6"><label class="form-label">Battery:</label><input id="m-battery" type="text" class="form-control" placeholder="e.g., 5000mAh"></div>
                                <div class="mb-3 col-6"><label class="form-label">Color:</label><input id="m-color" type="text" class="form-control"></div>
                            </div>

                            <!-- COMMON Fields -->
                            <div class="row"><div class="mb-3 col-6"><label class="form-label">Price:</label><input id="p-price" type="number" step="0.01" class="form-control" required></div><div class="mb-3 col-6"><label class="form-label">Stock:</label><input id="p-stock" type="number" class="form-control" required></div></div>
                            <div class="row"><div class="mb-3 col-6"><label class="form-label">Category:</label><select id="p-category" class="form-select"><option value="">Chọn category</option></select></div></div>
                            <div class="mb-3"><label class="form-label">Image URL:</label><input id="p-image" type="url" class="form-control"></div>
                            <div class="mb-3"><label class="form-label">Description:</label><textarea id="p-desc" class="form-control" rows="3"></textarea></div>

                            <div id="product-create-error" class="alert alert-danger d-none py-2 small"></div>
                            <div class="mb-3"><button type="submit" class="btn btn-warning">Submit</button></div>
                        </form>
                    </div>
                </div>
            </main>
            {% include 'admin/layout/footer.html' %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function flattenCategories(categories, prefix = '') {
            const result = [];
            for (const category of categories || []) {
                const itemName = prefix ? `${prefix} › ${category.name}` : category.name;
                result.push({ id: category.id, name: itemName });
                const children = Array.isArray(category.subcategories) ? category.subcategories : [];
                if (children.length) {
                    result.push(...flattenCategories(children, itemName));
                }
            }
            return result;
        }

        async function loadCategoryOptions() {
            const select = document.getElementById('p-category');
            const type = document.getElementById('p-type').value;
            try {
                const res = await fetch(`/api/categories/?product_type=${type}`);
                const data = await res.json();
                if (!res.ok || !Array.isArray(data)) {
                    throw new Error('Unable to load categories');
                }

                const flat = flattenCategories(data);
                const options = flat.map(item => `<option value="${item.id}">${item.name}</option>`).join('');
                select.innerHTML = `<option value="">Chọn category</option>${options}`;
            } catch (error) {
                select.innerHTML = '<option value="">Không tải được category</option>';
            }
        }

        function showCreateError(message) {
            const el = document.getElementById('product-create-error');
            el.textContent = message;
            el.classList.remove('d-none');
        }

        function toggleProductTypeFields() {
            const type = document.getElementById('p-type').value;
            
            // Hide all type-specific fields
            document.getElementById('book-fields').classList.add('d-none');
            document.getElementById('cloth-fields').classList.add('d-none');
            document.getElementById('laptop-fields').classList.add('d-none');
            document.getElementById('mobile-fields').classList.add('d-none');
            document.getElementById('generic-fields').classList.add('d-none');
            
            // Show the selected type's fields and update required attributes
            switch (type) {
                case 'book':
                    document.getElementById('book-fields').classList.remove('d-none');
                    document.getElementById('b-title').setAttribute('required', 'required');
                    document.getElementById('b-author').setAttribute('required', 'required');
                    break;
                case 'cloth':
                    document.getElementById('cloth-fields').classList.remove('d-none');
                    document.getElementById('c-name').setAttribute('required', 'required');
                    break;
                case 'laptop':
                    document.getElementById('laptop-fields').classList.remove('d-none');
                    document.getElementById('l-name').setAttribute('required', 'required');
                    break;
                case 'mobile':
                    document.getElementById('mobile-fields').classList.remove('d-none');
                    document.getElementById('m-name').setAttribute('required', 'required');
                    break;
                default:
                    document.getElementById('generic-fields').classList.remove('d-none');
                    document.getElementById('g-name').setAttribute('required', 'required');
                    break;
            }
            
            // Remove required from hidden fields
            const allInputs = document.querySelectorAll('[data-required="true"]');
            allInputs.forEach(input => {
                if (input.parentElement.closest('.d-none')) {
                    input.removeAttribute('required');
                }
            });
            
            // Reload categories when product type changes
            loadCategoryOptions();
        }

        async function createProduct() {
            const token = localStorage.getItem('admin_token');
            if (!token) {
                showCreateError('Bạn cần đăng nhập admin trước khi tạo sản phẩm.');
                return;
            }

            const type = document.getElementById('p-type').value;
            
            // Check for empty price and stock first
            const price = document.getElementById('p-price').value.trim();
            const stock = document.getElementById('p-stock').value.trim();
            
            if (!price) {
                showCreateError('Vui lòng nhập giá sản phẩm.');
                return;
            }
            
            if (!stock) {
                showCreateError('Vui lòng nhập số lượng tồn kho.');
                return;
            }

            const common = {
                price: price,
                stock: Number(stock || 0),
                category_id: document.getElementById('p-category').value ? Number(document.getElementById('p-category').value) : null,
                description: document.getElementById('p-desc').value.trim(),
                image_url: document.getElementById('p-image').value.trim(),
            };

            let payload;

            if (type === 'book') {
                const title = document.getElementById('b-title').value.trim();
                const author = document.getElementById('b-author').value.trim();
                
                if (!title) {
                    showCreateError('Vui lòng nhập tiêu đề sách.');
                    return;
                }
                if (!author) {
                    showCreateError('Vui lòng nhập tên tác giả.');
                    return;
                }
                
                payload = {
                    name: title,
                    product_type: type,
                    attributes: {
                        author: author,
                    },
                    ...common,
                };

            } else if (type === 'cloth') {
                const name = document.getElementById('c-name').value.trim();
                
                if (!name) {
                    showCreateError('Vui lòng nhập tên sản phẩm quần áo.');
                    return;
                }
                
                payload = {
                    name: name,
                    product_type: type,
                    attributes: {
                        brand: document.getElementById('c-brand').value.trim(),
                        size: document.getElementById('c-size').value.trim(),
                        color: document.getElementById('c-color').value.trim(),
                        material: document.getElementById('c-material').value.trim(),
                    },
                    ...common,
                };

            } else if (type === 'laptop') {
                const name = document.getElementById('l-name').value.trim();
                
                if (!name) {
                    showCreateError('Vui lòng nhập tên sản phẩm laptop.');
                    return;
                }
                
                payload = {
                    name: name,
                    product_type: type,
                    attributes: {
                        brand: document.getElementById('l-brand').value.trim(),
                        model: document.getElementById('l-model').value.trim(),
                        processor: document.getElementById('l-processor').value.trim(),
                        ram: document.getElementById('l-ram').value.trim(),
                        storage: document.getElementById('l-storage').value.trim(),
                        display_size: document.getElementById('l-display-size').value.trim(),
                        display_type: document.getElementById('l-display-type').value.trim(),
                        graphics: document.getElementById('l-graphics').value.trim(),
                        battery: document.getElementById('l-battery').value.trim(),
                        weight: document.getElementById('l-weight').value.trim(),
                        color: document.getElementById('l-color').value.trim(),
                    },
                    ...common,
                };

            } else if (type === 'mobile') {
                const name = document.getElementById('m-name').value.trim();
                
                if (!name) {
                    showCreateError('Vui lòng nhập tên sản phẩm điện thoại.');
                    return;
                }
                
                payload = {
                    name: name,
                    product_type: type,
                    attributes: {
                        brand: document.getElementById('m-brand').value.trim(),
                        model: document.getElementById('m-model').value.trim(),
                        os: document.getElementById('m-os').value.trim(),
                        processor: document.getElementById('m-processor').value.trim(),
                        ram: document.getElementById('m-ram').value.trim(),
                        storage: document.getElementById('m-storage').value.trim(),
                        display_size: document.getElementById('m-display-size').value.trim(),
                        display_type: document.getElementById('m-display-type').value.trim(),
                        camera: document.getElementById('m-camera').value.trim(),
                        battery: document.getElementById('m-battery').value.trim(),
                        color: document.getElementById('m-color').value.trim(),
                    },
                    ...common,
                };
            } else {
                const name = document.getElementById('g-name').value.trim();

                if (!name) {
                    showCreateError('Vui lòng nhập tên sản phẩm.');
                    return;
                }

                payload = {
                    name: name,
                    product_type: type,
                    attributes: {
                        brand: document.getElementById('g-brand').value.trim(),
                    },
                    ...common,
                };
            }

            const res = await fetch('/api/products/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Token ${token}`,
                },
                body: JSON.stringify(payload),
            });

            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const msg = data.error || Object.values(data || {}).flat().join(' | ') || 'Tạo sản phẩm thất bại';
                showCreateError(msg);
                return;
            }

            window.location.href = `/admin-panel/products/detail/?type=${type}&id=${data.id}`;
        }

        loadCategoryOptions();
        toggleProductTypeFields();
    </script>
</body>
</html>
