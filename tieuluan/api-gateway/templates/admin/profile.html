<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin@7.0.7/dist/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
    {% include 'admin/layout/header.html' %}
    <div id="layoutSidenav">
        {% include 'admin/layout/sidenav.html' %}
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Thông tin cá nhân</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin-panel/">Dashboard</a></li>
                        <li class="breadcrumb-item active">Profile</li>
                    </ol>

                    <div class="row col-lg-6">
                        <div class="card">
                            <div class="card-header fw-semibold">Cập nhật hồ sơ</div>
                            <div class="card-body">
                                <form onsubmit="event.preventDefault(); updateAdminProfile();">
                                    <div class="mb-3">
                                        <label class="form-label">Vai trò</label>
                                        <input id="admin-role" type="text" class="form-control" disabled>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Họ tên</label>
                                        <input id="admin-name" type="text" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input id="admin-email" type="email" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Số điện thoại</label>
                                        <input id="admin-phone" type="text" class="form-control">
                                    </div>
                                    <div id="admin-profile-error" class="alert alert-danger d-none py-2 small"></div>
                                    <div id="admin-profile-success" class="alert alert-success d-none py-2 small"></div>
                                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            {% include 'admin/layout/footer.html' %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentAdminId = null;
        let currentAdminType = '';

        function showProfileError(message) {
            const errorEl = document.getElementById('admin-profile-error');
            const successEl = document.getElementById('admin-profile-success');
            successEl.classList.add('d-none');
            errorEl.textContent = message;
            errorEl.classList.remove('d-none');
        }

        function showProfileSuccess(message) {
            const errorEl = document.getElementById('admin-profile-error');
            const successEl = document.getElementById('admin-profile-success');
            errorEl.classList.add('d-none');
            successEl.textContent = message;
            successEl.classList.remove('d-none');
        }

        function getAdminProfileEndpoint(id, type) {
            if (type === 'staff') {
                return `/api/staffs/${id}/`;
            }
            return `/api/managers/${id}/`;
        }

        async function loadAdminProfile() {
            const token = localStorage.getItem('admin_token');
            const info = JSON.parse(localStorage.getItem('admin_info') || '{}');
            currentAdminType = localStorage.getItem('admin_type') || '';
            currentAdminId = info.id;

            if (!token || !currentAdminId || !['manager', 'staff'].includes(currentAdminType)) {
                showProfileError('Không thể xác định phiên đăng nhập hợp lệ.');
                return;
            }

            document.getElementById('admin-role').value = currentAdminType === 'manager' ? 'Admin (Manager)' : 'Staff';

            try {
                const endpoint = getAdminProfileEndpoint(currentAdminId, currentAdminType);
                const response = await fetch(endpoint, {
                    headers: { 'Authorization': `Token ${token}` }
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(data.error || 'Không tải được thông tin cá nhân');
                }

                document.getElementById('admin-name').value = data.name || '';
                document.getElementById('admin-email').value = data.email || '';
                document.getElementById('admin-phone').value = data.phone || '';
            } catch (error) {
                showProfileError(error.message);
            }
        }

        async function updateAdminProfile() {
            const token = localStorage.getItem('admin_token');
            if (!token || !currentAdminId) {
                showProfileError('Phiên đăng nhập không hợp lệ.');
                return;
            }

            const payload = {
                name: document.getElementById('admin-name').value.trim(),
                email: document.getElementById('admin-email').value.trim(),
                phone: document.getElementById('admin-phone').value.trim(),
            };

            if (currentAdminType === 'staff') {
                payload.role = 'staff';
            }

            try {
                const endpoint = getAdminProfileEndpoint(currentAdminId, currentAdminType);
                const response = await fetch(endpoint, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(data.error || Object.values(data || {}).flat().join(' | ') || 'Cập nhật thất bại');
                }

                localStorage.setItem('admin_info', JSON.stringify(data));
                showProfileSuccess('Cập nhật thông tin cá nhân thành công.');

                if (typeof ensureAdminAuth === 'function') {
                    ensureAdminAuth();
                }
            } catch (error) {
                showProfileError(error.message);
            }
        }

        loadAdminProfile();
    </script>
</body>
</html>
