<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Dashboard - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin@7.0.7/dist/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
    {% include 'admin/layout/header.html' %}
    <div id="layoutSidenav">
        {% include 'admin/layout/sidenav.html' %}
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Dashboard</h1>
                    <ol class="breadcrumb mb-4"><li class="breadcrumb-item active">Dashboard</li></ol>
                    <div class="row">
                        <div class="col-xl-3 col-md-6"><div class="card bg-primary text-white mb-4"><div class="card-body">Users: <span id="metric-users">...</span></div></div></div>
                        <div class="col-xl-3 col-md-6"><div class="card bg-warning text-white mb-4"><div class="card-body">Products: <span id="metric-products">...</span></div></div></div>
                        <div class="col-xl-3 col-md-6"><div class="card bg-success text-white mb-4"><div class="card-body">Staff: <span id="metric-staff">...</span></div></div></div>
                        <div class="col-xl-3 col-md-6"><div class="card bg-danger text-white mb-4"><div class="card-body">Managers: <span id="metric-managers">...</span></div></div></div>
                    </div>
                </div>
            </main>
            {% include 'admin/layout/footer.html' %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        async function fetchList(path) {
            try {
                const res = await fetch(path);
                const data = await res.json();
                return Array.isArray(data) ? data : [];
            } catch {
                return [];
            }
        }

        async function loadDashboardMetrics() {
            const [customers, books, staffs, managers] = await Promise.all([
                fetchList('/api/customers/'),
                fetchList('/api/books/'),
                fetchList('/api/staffs/'),
                fetchList('/api/managers/'),
            ]);

            document.getElementById('metric-users').textContent = String(customers.length);
            document.getElementById('metric-products').textContent = String(books.length);
            document.getElementById('metric-staff').textContent = String(staffs.length);
            document.getElementById('metric-managers').textContent = String(managers.length);
        }

        loadDashboardMetrics();
    </script>
</body>
</html>
