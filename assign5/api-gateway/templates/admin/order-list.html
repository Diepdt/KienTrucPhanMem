<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Manage Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin@7.0.7/dist/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
    {% include 'admin/layout/header.html' %}
    <div id="layoutSidenav">
        {% include 'admin/layout/sidenav.html' %}
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage Orders</h1>
                    <ol class="breadcrumb mb-4"><li class="breadcrumb-item"><a href="/admin-panel/">Dashboard</a></li><li class="breadcrumb-item active">Orders</li></ol>
                    <div id="order-info" class="alert alert-info">Đang tải dữ liệu đơn hàng...</div>
                    <div class="small text-muted">Lưu ý: API hiện tại chỉ hỗ trợ customer xem đơn của chính họ qua token customer.</div>
                </div>
            </main>
            {% include 'admin/layout/footer.html' %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadOrderInfo() {
            const info = document.getElementById('order-info');
            try {
                const res = await fetch('/api/orders/');
                if (res.status === 401) {
                    info.className = 'alert alert-warning';
                    info.textContent = 'Không thể lấy toàn bộ đơn hàng bằng admin token do backend order-service hiện chỉ cho customer token.';
                    return;
                }

                const data = await res.json();
                if (Array.isArray(data)) {
                    info.className = 'alert alert-success';
                    info.textContent = `Đã lấy ${data.length} đơn hàng.`;
                    return;
                }

                info.className = 'alert alert-secondary';
                info.textContent = 'Order API chưa trả về dữ liệu dạng danh sách cho admin.';
            } catch {
                info.className = 'alert alert-danger';
                info.textContent = 'Không kết nối được order-service.';
            }
        }

        loadOrderInfo();
    </script>
</body>
</html>
