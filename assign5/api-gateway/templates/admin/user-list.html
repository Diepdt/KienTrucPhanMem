<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin@7.0.7/dist/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
    {% include 'admin/layout/header.html' %}
    <div id="layoutSidenav">
        {% include 'admin/layout/sidenav.html' %}
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage Users</h1>
                    <ol class="breadcrumb mb-4"><li class="breadcrumb-item"><a href="/admin-panel/">Dashboard</a></li><li class="breadcrumb-item active">Users</li></ol>
                    <div style="display:flex; justify-content: space-between; align-self: center;">
                        <h5>List User:</h5>
                        <div><a class="btn btn-warning" href="/admin-panel/users/create/">Create a new user</a></div>
                    </div>
                    <hr>
                    <table class="table table-hover table-striped table-boreded">
                        <thead><tr><th>ID</th><th>fullName</th><th>Email</th><th>Address</th><th>Phone</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody id="admin-user-list-body"></tbody>
                    </table>
                </div>
            </main>
            {% include 'admin/layout/footer.html' %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if (typeof adminRequireManagerPage === 'function' && !adminRequireManagerPage()) {
            throw new Error('Forbidden page for staff');
        }

        async function fetchList(path) {
            try {
                const res = await fetch(path);
                const data = await res.json();
                return Array.isArray(data) ? data : [];
            } catch {
                return [];
            }
        }

        function normalizeUsers(customers, staffs, managers) {
            const customerRows = customers.map(item => ({
                id: item.id,
                name: item.name || '',
                email: item.email || '',
                address: item.address || '',
                phone: item.phone || '',
                role: 'Customer',
                type: 'customer',
                is_active: Boolean(item.is_active),
            }));

            const staffRows = staffs.map(item => ({
                id: item.id,
                name: item.name || '',
                email: item.email || '',
                address: '',
                phone: item.phone || '',
                role: `Staff (${item.role || 'staff'})`,
                type: 'staff',
                is_active: Boolean(item.is_active),
            }));

            const managerRows = managers.map(item => ({
                id: item.id,
                name: item.name || '',
                email: item.email || '',
                address: '',
                phone: item.phone || '',
                role: 'Manager',
                type: 'manager',
                is_active: Boolean(item.is_active),
            }));

            return [...customerRows, ...staffRows, ...managerRows];
        }

        async function loadUsers() {
            const [customers, staffs, managers] = await Promise.all([
                fetchList('/api/customers/'),
                fetchList('/api/staffs/'),
                fetchList('/api/managers/'),
            ]);

            const rows = normalizeUsers(customers, staffs, managers);
            const body = document.getElementById('admin-user-list-body');
            if (!rows.length) {
                body.innerHTML = '<tr><td colspan="8" class="text-center text-muted">Không có dữ liệu người dùng</td></tr>';
                return;
            }

            body.innerHTML = rows.map((row) => `
                <tr>
                    <td>${row.id}</td>
                    <td>${row.name}</td>
                    <td>${row.email}</td>
                    <td>${row.address}</td>
                    <td>${row.phone}</td>
                    <td>${row.role}</td>
                    <td><span class="badge ${row.is_active ? 'bg-success' : 'bg-danger'}">${row.is_active ? 'Hoạt động' : 'Bị cấm'}</span></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-info btn-sm" href="/admin-panel/users/detail/?type=${row.type}&id=${row.id}">View</a>
                            <button class="btn btn-sm ${row.is_active ? 'btn-danger' : 'btn-success'}" onclick="toggleUserStatus('${row.type}', ${row.id}, ${row.is_active})">
                                ${row.is_active ? 'Cấm' : 'Mở cấm'}
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function toggleUserStatus(type, id, currentStatus) {
            const token = localStorage.getItem('admin_token');
            const adminInfo = JSON.parse(localStorage.getItem('admin_info') || '{}');

            if (!token) {
                alert('Bạn cần đăng nhập admin.');
                return;
            }

            if (type === 'manager' && Number(adminInfo.id) === Number(id) && currentStatus === true) {
                alert('Bạn không thể tự cấm chính tài khoản admin hiện tại.');
                return;
            }

            const nextStatus = !currentStatus;
            const actionLabel = nextStatus ? 'mở cấm' : 'cấm';
            if (!confirm(`Xác nhận ${actionLabel} tài khoản này?`)) {
                return;
            }

            let endpoint = '';
            if (type === 'customer') {
                endpoint = `/api/customers/${id}/admin-status/`;
            } else if (type === 'staff') {
                endpoint = `/api/staffs/${id}/`;
            } else {
                endpoint = `/api/managers/${id}/`;
            }

            try {
                const res = await fetch(endpoint, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify({ is_active: nextStatus })
                });

                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    alert(data.error || 'Cập nhật trạng thái tài khoản thất bại.');
                    return;
                }

                await loadUsers();
            } catch (error) {
                alert('Lỗi kết nối: ' + error.message);
            }
        }

        loadUsers();
    </script>
</body>
</html>
