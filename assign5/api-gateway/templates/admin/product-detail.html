<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Update Product</title>
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin@7.0.7/dist/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
    {% include 'admin/layout/header.html' %}
    <div id="layoutSidenav">
        {% include 'admin/layout/sidenav.html' %}
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage Products</h1>
                    <ol class="breadcrumb mb-4"><li class="breadcrumb-item"><a href="/admin-panel/">Dashboard</a></li><li class="breadcrumb-item"><a href="/admin-panel/products/">Products</a></li><li class="breadcrumb-item active">Update product</li></ol>
                    <div class="row col-6 mx-auto">
                        <form onsubmit="event.preventDefault();updateProduct();">
                            <div class="row"><div class="mb-3 col-6"><label class="form-label">Title:</label><input id="p-title" type="text" class="form-control"></div><div class="mb-3 col-6"><label class="form-label">Author:</label><input id="p-author" type="text" class="form-control"></div></div>
                            <div class="row"><div class="mb-3 col-6"><label class="form-label">ISBN:</label><input id="p-isbn" type="text" class="form-control"></div><div class="mb-3 col-6"><label class="form-label">Price:</label><input id="p-price" type="number" step="0.01" class="form-control"></div></div>
                            <div class="row"><div class="mb-3 col-6"><label class="form-label">Stock:</label><input id="p-stock" type="number" class="form-control"></div><div class="mb-3 col-6"><label class="form-label">Category ID:</label><input id="p-category" type="number" class="form-control"></div></div>
                            <div class="mb-3"><label class="form-label">Cover URL:</label><input id="p-cover" type="url" class="form-control"></div>
                            <div class="mb-3"><label class="form-label">Description:</label><textarea id="p-desc" class="form-control" rows="3"></textarea></div>
                            <div id="product-detail-error" class="alert alert-danger d-none py-2 small"></div>
                            <div style="display:flex; gap: 10px;"><button type="submit" class="btn btn-warning">Submit</button><button type="button" class="btn btn-danger" onclick="deleteProduct()">Delete</button><a class="btn btn-secondary" href="/admin-panel/products/">Cancel</a></div>
                        </form>
                    </div>
                </div>
            </main>
            {% include 'admin/layout/footer.html' %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentProductId = null;

        function getProductId() {
            const url = new URL(window.location.href);
            const id = url.searchParams.get('id');
            return id ? Number(id) : null;
        }

        function showDetailError(message) {
            const el = document.getElementById('product-detail-error');
            el.textContent = message;
            el.classList.remove('d-none');
        }

        async function loadProduct() {
            currentProductId = getProductId();
            if (!currentProductId) {
                showDetailError('Thiếu id sản phẩm trên URL.');
                return;
            }

            const res = await fetch(`/api/books/${currentProductId}/`);
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                showDetailError(data.error || 'Không tải được sản phẩm');
                return;
            }

            document.getElementById('p-title').value = data.title || '';
            document.getElementById('p-author').value = data.author || '';
            document.getElementById('p-isbn').value = data.isbn || '';
            document.getElementById('p-price').value = data.price || 0;
            document.getElementById('p-stock').value = data.stock || 0;
            document.getElementById('p-category').value = data.category_id ?? '';
            document.getElementById('p-cover').value = data.cover_url || '';
            document.getElementById('p-desc').value = data.description || '';
        }

        async function updateProduct() {
            if (!currentProductId) return;
            const token = localStorage.getItem('admin_token');
            if (!token) {
                showDetailError('Bạn cần đăng nhập admin trước khi cập nhật sản phẩm.');
                return;
            }

            const payload = {
                title: document.getElementById('p-title').value.trim(),
                author: document.getElementById('p-author').value.trim(),
                isbn: document.getElementById('p-isbn').value.trim() || null,
                price: document.getElementById('p-price').value,
                stock: Number(document.getElementById('p-stock').value || 0),
                category_id: document.getElementById('p-category').value ? Number(document.getElementById('p-category').value) : null,
                cover_url: document.getElementById('p-cover').value.trim(),
                description: document.getElementById('p-desc').value.trim(),
            };

            const res = await fetch(`/api/books/${currentProductId}/`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Token ${token}`,
                },
                body: JSON.stringify(payload),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                showDetailError(data.error || Object.values(data || {}).flat().join(' | ') || 'Cập nhật thất bại');
                return;
            }

            alert('Cập nhật thành công');
        }

        async function deleteProduct() {
            if (!currentProductId) return;
            if (!confirm('Bạn chắc chắn muốn xóa sản phẩm này?')) return;

            const token = localStorage.getItem('admin_token');
            if (!token) {
                showDetailError('Bạn cần đăng nhập admin trước khi xóa sản phẩm.');
                return;
            }

            const res = await fetch(`/api/books/${currentProductId}/`, {
                method: 'DELETE',
                headers: { 'Authorization': `Token ${token}` },
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                showDetailError(data.error || 'Xóa thất bại');
                return;
            }

            window.location.href = '/admin-panel/products/';
        }

        loadProduct();
    </script>
</body>
</html>
