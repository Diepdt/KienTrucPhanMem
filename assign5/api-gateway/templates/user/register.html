<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - LaptopShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 0; }
        .register-container { background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); overflow: hidden; max-width: 500px; width: 100%; margin: 20px; }
        .register-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .register-body { padding: 40px; }
        .btn-register { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 10px; padding: 12px; font-size: 16px; font-weight: 600; width: 100%; color: white; }
        .login-link { text-align: center; margin-top: 25px; padding-top: 25px; border-top: 1px solid #e0e0e0; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <i class="fas fa-user-plus fa-3x mb-3"></i>
            <h2>Đăng Ký Tài Khoản</h2>
            <p class="mb-0 mt-2">Tạo tài khoản mới tại LaptopShop</p>
        </div>
        <div class="register-body">
            <form onsubmit="event.preventDefault();registerCustomer();">
                <div class="mb-3"><input id="reg-name" type="text" class="form-control" placeholder="Họ và tên" required></div>
                <div class="mb-3"><input id="reg-email" type="email" class="form-control" placeholder="Email" required></div>
                <div class="mb-3"><input id="reg-password" type="password" class="form-control" placeholder="Mật khẩu" required></div>
                <div class="mb-3"><input id="reg-confirm" type="password" class="form-control" placeholder="Xác nhận mật khẩu" required></div>
                <div class="mb-3"><input id="reg-phone" type="tel" class="form-control" placeholder="Số điện thoại"></div>
                <div class="mb-4"><input id="reg-address" type="text" class="form-control" placeholder="Địa chỉ"></div>
                <div id="register-error" class="alert alert-danger d-none py-2 small"></div>
                <div id="register-success" class="alert alert-success d-none py-2 small"></div>
                <button type="submit" class="btn btn-register">
                    <i class="fas fa-user-plus me-2"></i>Đăng Ký
                </button>
            </form>
            <div class="login-link">
                <p class="mb-0">Đã có tài khoản? <a href="/user/login/">Đăng nhập ngay</a></p>
            </div>
        </div>
    </div>

    <script>
        function showRegisterMessage(id, message) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.classList.remove('d-none');
        }

        function clearRegisterMessage() {
            document.getElementById('register-error').classList.add('d-none');
            document.getElementById('register-success').classList.add('d-none');
        }

        async function registerCustomer() {
            clearRegisterMessage();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm').value;
            const phone = document.getElementById('reg-phone').value.trim();
            const address = document.getElementById('reg-address').value.trim();

            if (password !== confirmPassword) {
                showRegisterMessage('register-error', 'Mật khẩu xác nhận không khớp');
                return;
            }

            const res = await fetch('/api/customers/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, phone, address }),
            });

            let data = {};
            try { data = await res.json(); } catch {}

            if (!res.ok) {
                const message = data.error || Object.values(data || {}).flat().join(' | ') || 'Đăng ký thất bại';
                showRegisterMessage('register-error', message);
                return;
            }

            localStorage.setItem('customer_token', data.token);
            localStorage.setItem('customer_info', JSON.stringify(data.customer || {}));
            showRegisterMessage('register-success', 'Đăng ký thành công, đang chuyển trang...');
            setTimeout(() => {
                window.location.href = '/customer/';
            }, 700);
        }
    </script>
</body>
</html>
