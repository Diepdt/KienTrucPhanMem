<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - LaptopShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); overflow: hidden; max-width: 450px; width: 100%; }
        .login-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .login-body { padding: 40px; }
        .btn-login { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 10px; padding: 12px; font-size: 16px; font-weight: 600; width: 100%; color: white; }
        .register-link { text-align: center; margin-top: 25px; padding-top: 25px; border-top: 1px solid #e0e0e0; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-laptop fa-3x mb-3"></i>
            <h2>Đăng Nhập</h2>
            <p class="mb-0 mt-2">Chào mừng bạn đến với LaptopShop</p>
        </div>
        <div class="login-body">
            <ul class="nav nav-tabs mb-3" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-customer" type="button">Customer</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-admin" type="button">Admin</button>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="tab-customer">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input id="customer-email" type="email" class="form-control" placeholder="customer@test.local" required>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input id="customer-password" type="password" class="form-control" placeholder="Mật khẩu" required>
                    </div>
                    <div id="customer-error" class="alert alert-danger d-none py-2 small"></div>
                    <button type="button" class="btn btn-login" onclick="loginCustomer()">
                        <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập Customer
                    </button>
                </div>

                <div class="tab-pane fade" id="tab-admin">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input id="admin-email" type="email" class="form-control" placeholder="admin/staff email" required>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input id="admin-password" type="password" class="form-control" placeholder="Mật khẩu" required>
                    </div>
                    <div id="admin-error" class="alert alert-danger d-none py-2 small"></div>
                    <button type="button" class="btn btn-login" onclick="loginAdmin()">
                        <i class="fas fa-user-shield me-2"></i>Đăng nhập Admin
                    </button>
                </div>
            </div>
            <div class="register-link">
                <p class="mb-0">Chưa có tài khoản? <a href="/user/register/">Đăng ký ngay</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function postJson(path, body) {
            const res = await fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            let data = {};
            try { data = await res.json(); } catch {}
            return { ok: res.ok, status: res.status, data };
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.remove('d-none');
        }

        function clearErrors() {
            document.getElementById('customer-error').classList.add('d-none');
            document.getElementById('admin-error').classList.add('d-none');
        }

        async function loginCustomer() {
            clearErrors();
            const email = document.getElementById('customer-email').value.trim();
            const password = document.getElementById('customer-password').value;

            const result = await postJson('/api/customers/login/', { email, password });
            if (!result.ok) {
                showError('customer-error', result.data.error || 'Đăng nhập customer thất bại');
                return;
            }

            localStorage.setItem('customer_token', result.data.token);
            localStorage.setItem('customer_info', JSON.stringify(result.data.customer || {}));
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_info');
            localStorage.removeItem('admin_type');
            window.location.href = '/customer/';
        }

        async function loginAdmin() {
            clearErrors();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;

            let result = await postJson('/api/manager/login/', { email, password });
            if (result.ok) {
                localStorage.setItem('admin_token', result.data.token);
                localStorage.setItem('admin_info', JSON.stringify(result.data.manager || {}));
                localStorage.setItem('admin_type', 'manager');
                window.location.href = '/admin-panel/';
                return;
            }

            result = await postJson('/api/staff/login/', { email, password });
            if (result.ok) {
                localStorage.setItem('admin_token', result.data.token);
                localStorage.setItem('admin_info', JSON.stringify(result.data.staff || {}));
                localStorage.setItem('admin_type', 'staff');
                window.location.href = '/admin-panel/';
                return;
            }

            showError('admin-error', 'Đăng nhập admin thất bại (manager/staff đều không hợp lệ).');
        }
    </script>
</body>
</html>
