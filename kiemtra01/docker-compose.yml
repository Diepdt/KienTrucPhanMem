services:
  mysql:
    image: mysql:8.4
    container_name: laptopshop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: identity_db
    ports:
      - "33406:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: laptopshop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: catalog_db
    ports:
      - "35432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  catalog-service:
    build:
      context: ./services/catalog-service
    container_name: catalog-service
    environment:
      PORT: 4001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: catalog_db
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: ./services/customer-service
    container_name: customer-service
    environment:
      PORT: 4002
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      MYSQL_DATABASE: identity_db
      CATALOG_SERVICE_URL: http://catalog-service:4001
    depends_on:
      mysql:
        condition: service_healthy
      catalog-service:
        condition: service_started

  staff-service:
    build:
      context: ./services/staff-service
    container_name: staff-service
    environment:
      PORT: 4003
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      MYSQL_DATABASE: identity_db
      CATALOG_SERVICE_URL: http://catalog-service:4001
    depends_on:
      mysql:
        condition: service_healthy
      catalog-service:
        condition: service_started

  web-gateway:
    build:
      context: ./web-gateway
    container_name: web-gateway
    environment:
      PORT: 3000
      CUSTOMER_SERVICE_URL: http://customer-service:4002
      STAFF_SERVICE_URL: http://staff-service:4003
      CATALOG_SERVICE_URL: http://catalog-service:4001
      SESSION_SECRET: keyboard-cat
    depends_on:
      customer-service:
        condition: service_started
      staff-service:
        condition: service_started
      catalog-service:
        condition: service_started
    ports:
      - "3200:3000"
    volumes:
      - ./template:/app/template:ro
      - ./public:/app/public:ro

volumes:
  mysql_data:
  postgres_data:
